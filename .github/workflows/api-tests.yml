name: LonApp API Tests

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Target API environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - dev

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve environment
        id: env
        run: |
          TARGET="${{ github.event.inputs.environment }}"
          if [ -z "$TARGET" ]; then
            TARGET="staging"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Running against: $TARGET"

      - name: Run Playwright API tests
        id: tests
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI || 'https://google.com' }}
        run: npx playwright test --project=${{ steps.env.outputs.target }}

      - name: Setup Java (Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.env.outputs.target }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.env.outputs.target }}
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.env.outputs.target }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      # Gmail blocks Allure HTML/JS zip attachments (552-5.7.0). Email a summary + artifact links instead.
      - name: Email Allure report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: LonApp API Test Automation Report
          to: jackie.botchway@gmail.com,boakye@gmail.com,wuudof@gmail.com,jayphadit@gmail.com
          from: LonApp API Tests <razaqyaro@gmail.com>
          html_body: |
            <p><strong>LonApp API Test Automation Report</strong></p>
            <ul>
              <li><strong>Status:</strong> ${{ job.status }}</li>
              <li><strong>Environment:</strong> ${{ steps.env.outputs.target }}</li>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Actor:</strong> ${{ github.actor }}</li>
            </ul>
            <p>
              Open the workflow run to download the <strong>Allure</strong> and <strong>Playwright</strong> reports:<br/>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              </a>
            </p>
            <p>
              Artifacts on that page:<br/>
              <code>allure-report-${{ steps.env.outputs.target }}</code> — unzip and open <code>index.html</code><br/>
              <code>playwright-report-${{ steps.env.outputs.target }}</code> — Playwright HTML report
            </p>
