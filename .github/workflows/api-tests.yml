name: LonApp API Tests

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Target API environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - dev

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Run Playwright API tests and publish raw results
  # ---------------------------------------------------------------------------
  test:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      target: ${{ steps.env.outputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve environment
        id: env
        run: |
          TARGET="${{ github.event.inputs.environment }}"
          if [ -z "$TARGET" ]; then
            TARGET="staging"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Running against: $TARGET"

      - name: Run Playwright API tests
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_REDIRECT_URI: ${{ secrets.GMAIL_REDIRECT_URI || 'https://google.com' }}
        run: npx playwright test --project=${{ steps.env.outputs.target }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.env.outputs.target }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.env.outputs.target }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) Build Allure HTML report and publish to gh-pages
  # ---------------------------------------------------------------------------
  allure:
    name: Generate Allure report
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      report_url: ${{ steps.url.outputs.report_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Allure raw results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ needs.test.outputs.target }}
          path: allure-results

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Prepare report for GitHub Pages
        run: touch allure-report/.nojekyll

      - name: Upload Allure HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ needs.test.outputs.target }}
          path: allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Allure report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          force_orphan: true
          commit_message: 'Publish Allure report ${{ github.run_id }}'

      - name: Set report URL
        id: url
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "report_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Allure report URL: $URL"

  # ---------------------------------------------------------------------------
  # 3) Email stakeholders with published Allure URL
  # ---------------------------------------------------------------------------
  notify:
    name: Email stakeholders
    needs: [test, allure]
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve Allure report URL
        id: report
        run: |
          URL="${{ needs.allure.outputs.report_url }}"
          if [ -z "$URL" ]; then
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Email Allure report
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: LonApp API Test Automation Report
          to: jackie.botchway@gmail.com,boakye@gmail.com,wuudof@gmail.com,jayphadit@gmail.com
          from: LonApp API Tests <razaqyaro@gmail.com>
          html_body: |
            <p><strong>LonApp API Test Automation Report</strong></p>
            <ul>
              <li><strong>Test status:</strong> ${{ needs.test.result }}</li>
              <li><strong>Allure job:</strong> ${{ needs.allure.result }}</li>
              <li><strong>Environment:</strong> ${{ needs.test.outputs.target }}</li>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Actor:</strong> ${{ github.actor }}</li>
            </ul>
            <p>
              <strong>Allure report:</strong><br/>
              <a href="${{ steps.report.outputs.url }}">${{ steps.report.outputs.url }}</a>
            </p>
            <p>
              Workflow run (Playwright artifact if needed):<br/>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              </a>
            </p>
